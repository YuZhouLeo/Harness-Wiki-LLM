<!doctype html><!-- 版面喜好選單範例 AC04｜按鈕回饋脹縮｜來源：講師範例庫 output範例/元件庫/AC04-按鈕回饋脹縮.html；原始來源 https://github.com/animate-css/animate.css（source/attention_seekers/pulse.css），作者 Nick Pettit（原檔註記；收錄於 Daniel Eden 的 animate.css），授權 Hippocratic-2.1。複製時調整：字型改成有網路才載入、改掉對外連結與示意內容裡的私人資料。 -->
<!--
  AC04 按鈕回饋脹縮（pulse）
  來源：https://github.com/animate-css/animate.css　source/attention_seekers/pulse.css
  原作者：Nick Pettit（原檔註記；收錄於 Daniel Eden 的 animate.css）　授權：Hippocratic-2.1
  移植：抄 pulse 的 @keyframes，重複次數設為 2；按鈕用藍色填色（原作無外觀），按下與重播都會觸發。
  2026-10-08 由子代理移植成純 HTML／CSS
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pulse</title><style>
:root{--ink:#1f2937;--mut:#6b7280;--line:#cbd5e1;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--info:#1d4ed8;--infobg:#dbeafe}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.panel{width:430px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);background:#f1f5f9;font-weight:700}
button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid #94a3b8;background:#fff;border-radius:4px;cursor:pointer;color:var(--ink)}
.tag{display:inline-block;padding:0 8px;border-radius:3px;font-size:12px;font-weight:700}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}.info{background:var(--infobg);color:var(--info)}
.row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #e2e8f0}
.row b{width:76px;font-weight:700}
.a{animation-duration:1s;animation-fill-mode:both}
/* pulse 原作者 Nick Pettit */
@keyframes pulse{from{transform:scale3d(1,1,1)}50%{transform:scale3d(1.05,1.05,1.05)}to{transform:scale3d(1,1,1)}}
.pulse{animation-name:pulse;animation-timing-function:ease-in-out;animation-iteration-count:2}
.go{padding:8px 22px;font-size:15px;font-weight:700;background:var(--info);color:#fff;border:1px solid #1e40af;border-radius:5px;display:inline-block}
.box{padding:30px 20px;text-align:center}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
</style></head><body>
<div class="panel"><div class="hd">講義下載<button id="r">重播</button></div>
<div class="row"><b>第 3 週</b><span style="flex:1">策略管理講義</span><span class="tag info">PDF</span></div>
<div class="row"><b>第 4 週</b><span style="flex:1">財務報表分析</span><span class="tag info">PDF</span></div>
<div class="box"><button class="go a pulse" id="d">下載講義</button><div style="color:var(--mut);margin-top:10px">按下按鈕時會輕輕脹縮一次，提示已收到</div></div></div>
<script>function play(e,c){e.classList.remove(c);void e.offsetWidth;e.classList.add(c)}
var d=document.getElementById('d');document.getElementById('r').onclick=d.onclick=function(){play(d,'pulse')}</script></body></html>
