<!doctype html><!-- 版面喜好選單範例 AC01｜輸入錯誤時搖頭｜來源：講師範例庫 output範例/元件庫/AC01-查核錯誤欄搖頭.html；原始來源 https://github.com/animate-css/animate.css（source/attention_seekers/headShake.css），作者 Daniel Eden，授權 Hippocratic-2.1。複製時調整：字型改成有網路才載入、改掉對外連結與示意內容裡的私人資料。 -->
<!--
  AC01 查核錯誤欄搖頭（headShake）
  來源：https://github.com/animate-css/animate.css　source/attention_seekers/headShake.css
  原作者：Daniel Eden　授權：Hippocratic-2.1
  移植：只抄 headShake 的 @keyframes 與 class；示範介面為自製的淺色查核表，錯誤狀態用紅底，原作沒有顏色。
  2026-10-08 由子代理移植成純 HTML／CSS
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>headShake</title><style>
:root{--ink:#1f2937;--mut:#6b7280;--line:#cbd5e1;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--info:#1d4ed8;--infobg:#dbeafe}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.panel{width:430px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);background:#f1f5f9;font-weight:700}
button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid #94a3b8;background:#fff;border-radius:4px;cursor:pointer;color:var(--ink)}
.tag{display:inline-block;padding:0 8px;border-radius:3px;font-size:12px;font-weight:700}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}.info{background:var(--infobg);color:var(--info)}
.row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #e2e8f0}
.row b{width:76px;font-weight:700}
.a{animation-duration:1s;animation-fill-mode:both}
@keyframes headShake{0%{transform:translateX(0)}6.5%{transform:translateX(-6px) rotateY(-9deg)}18.5%{transform:translateX(5px) rotateY(7deg)}31.5%{transform:translateX(-3px) rotateY(-5deg)}43.5%{transform:translateX(2px) rotateY(3deg)}50%{transform:translateX(0)}}
.headShake{animation-timing-function:ease-in-out;animation-name:headShake}
input{font:inherit;width:150px;padding:2px 8px;border:1px solid #94a3b8;border-radius:3px;display:inline-block}
input.err{border-color:var(--bad);background:var(--badbg)}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
</style></head><body>
<div class="panel"><div class="hd">發票查核<button id="r">重新查核</button></div>
<div class="row"><b>統一編號</b><input value="12345678"><span class="tag ok">通過</span></div>
<div class="row"><b>發票號碼</b><input value="AB-12345678"><span class="tag ok">通過</span></div>
<div class="row"><b>金額</b><input id="x" class="err a headShake" value="1,2OO"><span class="tag bad">格式錯誤</span></div>
<div class="row" style="border:0;color:var(--mut)">金額欄含英文字母 O，請改成數字 0</div></div>
<script>function play(e,c){e.classList.remove(c);void e.offsetWidth;e.classList.add(c)}
var x=document.getElementById('x');document.getElementById('r').onclick=function(){play(x,'headShake')}</script></body></html>
