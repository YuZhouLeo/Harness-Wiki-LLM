<!doctype html><!-- 版面喜好選單範例 AC07｜完成章搖擺｜來源：講師範例庫 output範例/元件庫/AC07-完成章搖擺.html；原始來源 https://github.com/animate-css/animate.css（source/attention_seekers/tada.css），作者 Daniel Eden，授權 Hippocratic-2.1。複製時調整：字型改成有網路才載入、改掉對外連結與示意內容裡的私人資料。 -->
<!--
  AC07 完成章搖擺（tada）
  來源：https://github.com/animate-css/animate.css　source/attention_seekers/tada.css
  原作者：Daniel Eden　授權：Hippocratic-2.1
  移植：抄 tada 的 @keyframes；標章為自製的綠框淺綠底，原作無外觀。
  2026-10-08 由子代理移植成純 HTML／CSS
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tada</title><style>
:root{--ink:#1f2937;--mut:#6b7280;--line:#cbd5e1;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--info:#1d4ed8;--infobg:#dbeafe}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.panel{width:430px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);background:#f1f5f9;font-weight:700}
button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid #94a3b8;background:#fff;border-radius:4px;cursor:pointer;color:var(--ink)}
.tag{display:inline-block;padding:0 8px;border-radius:3px;font-size:12px;font-weight:700}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}.info{background:var(--infobg);color:var(--info)}
.row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #e2e8f0}
.row b{width:76px;font-weight:700}
.a{animation-duration:1s;animation-fill-mode:both}
@keyframes tada{from{transform:scale3d(1,1,1)}10%,20%{transform:scale3d(.9,.9,.9) rotate3d(0,0,1,-3deg)}30%,50%,70%,90%{transform:scale3d(1.1,1.1,1.1) rotate3d(0,0,1,3deg)}40%,60%,80%{transform:scale3d(1.1,1.1,1.1) rotate3d(0,0,1,-3deg)}to{transform:scale3d(1,1,1)}}
.tada{animation-name:tada}
.stamp{display:inline-block;padding:6px 20px;border:2px solid var(--ok);color:var(--ok);background:var(--okbg);font-size:20px;font-weight:700;border-radius:4px}
.box{padding:26px;text-align:center}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
</style></head><body>
<div class="panel"><div class="hd">講義整理進度<button id="r">重播</button></div>
<div class="row"><b>照片轉錄</b><span class="tag ok">完成</span></div>
<div class="row"><b>母版整理</b><span class="tag ok">完成</span></div>
<div class="row"><b>HTML 輸出</b><span class="tag ok">完成</span></div>
<div class="box"><span class="stamp a tada" id="s">全部完成</span></div></div>
<script>function play(e,c){e.classList.remove(c);void e.offsetWidth;e.classList.add(c)}
var s=document.getElementById('s');document.getElementById('r').onclick=function(){play(s,'tada')}</script></body></html>
