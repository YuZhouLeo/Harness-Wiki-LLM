<!doctype html><!-- 版面喜好選單範例 GX22｜連線狀態載入｜來源：講師範例庫 output範例/元件庫/GX22-伺服器連線載入.html；原始來源 https://github.com/uiverse-io/galaxy（loaders/catraco_green-crab-61.html），作者 catraco，授權 MIT。複製時調整：字型改成有網路才載入、改掉對外連結與示意內容裡的私人資料。 -->
<!--
  GX22 伺服器連線載入（Server icon with a rotating open ring while connecting）
  來源：https://github.com/uiverse-io/galaxy　loaders/catraco_green-crab-61.html
  原作者：catraco　授權：MIT (Copyright 2023 Uiverse.io)　commit：adbd2ad
  移植：保留原作的結構與節奏——40px 細圓環（底部一段留空）以 .8s 反向旋轉，中間伺服器圖示同步 .8s 透明度微閃；
    原作圖示是 Font Awesome 路徑，改成自繪 inline SVG 伺服器機櫃；圓環 1px 加粗成 1.5px，灰色 #a5a5b0 改成 P11：圓環 --accent、圖示 --ink-2；
    做成「服務狀態」三列：連線中（動畫）、已連線（--ok 實線圓）、離線（--bad 虛線圓＋「重新連線」鈕），
    按重新連線會進入連線中 2 秒再變已連線（少量原生 JS）；每列都有文字狀態，不只靠顏色；
    prefers-reduced-motion 時圓環不旋轉，只留透明度呼吸。
  2026-10-09 由子代理移植成純 HTML／CSS（必要時加少量原生 JS）
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伺服器連線載入</title>
<style>
:root{
  --bg:#e8ecef;--surface:#f6f8f9;--surface-2:#dde3e7;--ink:#11181f;--ink-2:#435059;--line:#c5cdd4;--line-strong:#2b3945;
  --accent:#006666;--on-accent:#ffffff;--accent-soft:#d7eeec;
  --c1:#006666;--c2:#845600;--c3:#2b5c96;--c4:#664990;--c1-soft:#d7eeec;--c2-soft:#f7ead0;--c3-soft:#dde7f3;--c4-soft:#e9e2f3;
  --ok:#1b6b3d;--warn:#845600;--bad:#b3261e;--ok-soft:#d9efe1;--warn-soft:#f7ead0;--bad-soft:#f8dedb;--answer:#b3261e;--hl:#ffe08a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px 16px;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.hd{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.hd h1{margin:0;font-size:15px;font-weight:700}
.hd span{font-size:12px;color:var(--ink-2)}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:500}
.tx small{display:block;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.st{font-size:12px;font-weight:700;white-space:nowrap}
.row[data-s=run] .st{color:var(--accent)}
.row[data-s=ok] .st{color:var(--ok)}
.row[data-s=bad] .st{color:var(--bad)}
.retry{font:inherit;font-size:12px;font-weight:700;padding:3px 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.retry:hover{background:var(--surface-2)}
.retry:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row:not([data-s=bad]) .retry{display:none}

/* 原作 .loader：圖示＋外圈 span */
.loader{--color:var(--ink-2);--ring:var(--accent);--size:40px;position:relative;flex:none;width:var(--size);height:var(--size);color:var(--color)}
.loader span{position:absolute;inset:0;border:1.5px solid var(--ring);border-bottom-color:transparent;border-radius:100%}
.loader svg{display:block;width:100%;height:100%;padding:25%;fill:currentColor}
.row[data-s=run] .loader span{animation:keyframes-rotate .8s infinite linear}
.row[data-s=run] .loader svg{animation:keyframes-blink .8s infinite ease-in-out}
.row[data-s=ok] .loader{--color:var(--ok);--ring:var(--ok)}
.row[data-s=ok] .loader span{border-bottom-color:var(--ok)}
.row[data-s=bad] .loader{--color:var(--bad);--ring:var(--bad)}
.row[data-s=bad] .loader span{border-style:dashed;border-bottom-color:var(--bad)}
@keyframes keyframes-rotate{0%{transform:rotate(360deg)}}
@keyframes keyframes-blink{50%{opacity:.8}}
@keyframes breathe{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  .row[data-s=run] .loader span{animation:breathe 1.6s ease-in-out infinite}
  .row[data-s=run] .loader svg{animation:none}
}
</style></head><body>
<div class="card">
  <div class="hd"><h1>服務狀態</h1><span>每 30 秒自動檢查</span></div>
  <div class="row" data-s="run" role="status"><span class="loader" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M5 2.5h14a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3zm10.5 3.4a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm3.2 0a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM5 12.5h14a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3zm10.5 3.4a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm3.2 0a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2z"/></svg><span></span></span>
    <span class="tx"><b>筆記庫同步主機</b><small>macOS ↔ Windows</small></span><span class="st">連線中…</span></div>
  <div class="row" data-s="ok"><span class="loader" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M5 2.5h14a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3zm10.5 3.4a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm3.2 0a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM5 12.5h14a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3zm10.5 3.4a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm3.2 0a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2z"/></svg><span></span></span>
    <span class="tx"><b>轉錄服務</b><small>回應 42 ms</small></span><span class="st">已連線</span></div>
  <div class="row" data-s="bad" id="r3"><span class="loader" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M5 2.5h14a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3zm10.5 3.4a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm3.2 0a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM5 12.5h14a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3zm10.5 3.4a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm3.2 0a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2z"/></svg><span></span></span>
    <span class="tx"><b>備份硬碟</b><small id="r3s">最後回應 3 小時前</small></span><span class="st" id="r3t">離線</span><button class="retry" id="retry" type="button">重新連線</button></div>
</div>
<script>
const r=document.getElementById('r3'),t=document.getElementById('r3t'),s=document.getElementById('r3s'),b=document.getElementById('retry');
b.addEventListener('click',()=>{
  r.dataset.s='run';r.setAttribute('role','status');t.textContent='連線中…';s.textContent='正在喚醒硬碟';
  setTimeout(()=>{r.dataset.s='ok';t.textContent='已連線';s.textContent='回應 120 ms'},2000);
});
</script>
</body></html>
