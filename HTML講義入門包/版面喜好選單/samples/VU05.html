<!--
  VU05 進度條（Progress）
  來源：https://github.com/Ashutoshx7/VengeanceUI　src/components/ui/progress.tsx
  原作者：原檔未標　授權：MIT
  移植：Radix Progress 改純 div＋transform；原作單一 primary 色，我改成三條各綁一色並加百分比文字與重新模擬按鈕；過渡時間 .6s 沿用 ease 曲線近似。
  2026-10-08 由子代理移植成純 HTML／CSS
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>進度條</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#1f2937}
.panel{width:360px;background:#fff;border:1px solid #d4d4d8;border-radius:8px;padding:16px;display:grid;gap:14px}
.h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.h span:last-child{font-variant-numeric:tabular-nums;color:#4b5563}
.track{position:relative;height:8px;border-radius:99px;overflow:hidden;background:var(--t)}
.bar{height:100%;width:100%;background:var(--c);transform:translateX(-100%);transition:transform .6s cubic-bezier(.4,0,.2,1)}
.a{--c:#2563eb;--t:#dbeafe}.b{--c:#16a34a;--t:#dcfce7}.c{--c:#d97706;--t:#fef3c7}
button{font:inherit;font-size:14px;padding:7px 14px;border:1px solid #a1a1aa;border-radius:6px;background:#fff;color:#1f2937;cursor:pointer}
button:hover{background:#f4f4f5}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar{transition:none}button:active{transform:none}}
</style>
</head>
<body>
<div class="panel">
<div class="a"><div class="h"><span>轉錄音檔</span><span data-v>0%</span></div><div class="track"><div class="bar"></div></div></div>
<div class="b"><div class="h"><span>比對數字</span><span data-v>0%</span></div><div class="track"><div class="bar"></div></div></div>
<div class="c"><div class="h"><span>產生講義</span><span data-v>0%</span></div><div class="track"><div class="bar"></div></div></div>
<button id="go">重新模擬</button>
</div>
<script>
const bars=document.querySelectorAll('.bar'),vs=document.querySelectorAll('[data-v]');
function set(a){a.forEach((v,i)=>{bars[i].style.transform='translateX(-'+(100-v)+'%)';vs[i].textContent=v+'%'})}
function run(){set([0,0,0]);setTimeout(()=>set([100,64,28]),60)}
document.getElementById('go').onclick=()=>{set([0,0,0]);setTimeout(()=>set([1,2,3].map(()=>Math.round(20+Math.random()*80))),60)};
run();
</script>
</body>
</html>
