<!doctype html><!-- 版面喜好選單範例 GX28｜可關閉行內提示｜來源：講師範例庫 output範例/元件庫/GX28-可關閉行內提示.html；原始來源 https://github.com/uiverse-io/galaxy（Cards/andrew-demchenk0_warm-gecko-73.html），作者 andrew-demchenk0，授權 MIT。複製時調整：字型改成有網路才載入、改掉對外連結與示意內容裡的私人資料。 -->
<!--
  GX28 可關閉行內提示（Inline status alert with close button）
  來源：https://github.com/uiverse-io/galaxy　Cards/andrew-demchenk0_warm-gecko-73.html
  原作者：andrew-demchenk0　授權：MIT (Copyright 2023 Uiverse.io)　commit：adbd2ad
  移植：原作是單條 320px 亮綠色成功提示（勾勾圖示＋文字＋右側 ×，圓角 8px、細陰影），× 不能按；
    保留圖示／文字／關閉鈕的三段排法與圓角陰影，配色換 P11：底改 --ok-soft，圖示 --ok；
    延伸出注意（--warn）與失敗（--bad）兩種，圖示另畫 inline SVG（勾沿用原作路徑）；
    × 改成 <button>，按下以 0.2 秒淡出並收合高度後移除，可「重新顯示」；補 focus-visible 與 prefers-reduced-motion。
    （本支原為入選的 dhruv465_spotty-cow-20 單圓環載入器，因和既有 GX06 時鐘載入指示同是 8px 圓框轉圈、示範價值低，改用同組備選第一名。）
  2026-10-09 由子代理移植成純 HTML／CSS（必要時加少量原生 JS）
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可關閉行內提示</title>
<style>
:root{
  --bg:#e8ecef;--surface:#f6f8f9;--surface-2:#dde3e7;--ink:#11181f;--ink-2:#435059;--line:#c5cdd4;--line-strong:#2b3945;
  --accent:#006666;--on-accent:#ffffff;--accent-soft:#d7eeec;
  --c1:#006666;--c2:#845600;--c3:#2b5c96;--c4:#664990;--c1-soft:#d7eeec;--c2-soft:#f7ead0;--c3-soft:#dde7f3;--c4-soft:#e9e2f3;
  --ok:#1b6b3d;--warn:#845600;--bad:#b3261e;--ok-soft:#d9efe1;--warn-soft:#f7ead0;--bad-soft:#f8dedb;--answer:#b3261e;--hl:#ffe08a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.panel{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px 12px}
.panel h1{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.panel h1 small{font-size:12px;font-weight:400;color:var(--ink-2)}
.stack{display:block}

/* 提示條：原作 padding 12px、圓角 8px、0 0 5px -3px 陰影、圖示 20px＋右側 × */
.alert{--tone:var(--ok);--soft:var(--ok-soft);align-items:center;gap:8px;padding:10px 8px 10px 12px;background:var(--soft);border:1px solid color-mix(in srgb,var(--tone) 22%,transparent);border-radius:8px;box-shadow:0 0 5px -3px var(--ink);
  display:grid;grid-template-columns:20px 1fr 28px;transition:opacity .2s ease,transform .2s ease}
.alert.warn{--tone:var(--warn);--soft:var(--warn-soft)}
.alert.bad{--tone:var(--bad);--soft:var(--bad-soft)}
.alert .ic{width:20px;height:20px;transform:translateY(-1px)}
.alert .ic path{fill:var(--tone)}
.alert .t{font-weight:500;font-size:14px;color:var(--ink);min-width:0}
.alert .t b{color:var(--tone);font-weight:700;margin-right:4px}
.alert .x{width:28px;height:28px;display:grid;place-items:center;margin:0;padding:0;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer}
.alert .x svg{width:18px;height:18px}
.alert .x path{fill:currentColor}
.alert .x:hover{background:color-mix(in srgb,var(--tone) 12%,transparent);color:var(--ink)}
.alert .x:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.alert.out{opacity:0;transform:scale(.98)}
.wrapR{display:grid;grid-template-rows:1fr;margin-bottom:8px;transition:grid-template-rows .2s ease,margin-bottom .2s ease}
.wrapR:last-child{margin-bottom:0}
.wrapR>div{overflow:hidden;min-height:0;padding:2px;margin:-2px;transition:padding .2s ease}
.wrapR.gone{grid-template-rows:0fr;margin-bottom:0}
.wrapR.gone>div{visibility:hidden;padding:0}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--ink-2)}
.reset{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.reset:hover{border-color:var(--line-strong)}
.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.alert{transition:opacity .15s ease}.alert.out{transform:none}.wrapR{transition:none}}
</style></head><body>
<section class="panel" aria-labelledby="h">
  <h1 id="h">匯出講義 PDF<small>剛剛</small></h1>
  <div class="stack" id="stack">
    <div class="wrapR"><div><div class="alert" role="status">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="m12 1c-6.075 0-11 4.925-11 11s4.925 11 11 11 11-4.925 11-11-4.925-11-11-11zm4.768 9.14c.0878-.1004.1546-.21726.1966-.34383.0419-.12657.0581-.26026.0477-.39319-.0105-.13293-.0475-.26242-.1087-.38085-.0613-.11844-.1456-.22342-.2481-.30879-.1024-.08536-.2209-.14938-.3484-.18828s-.2616-.0519-.3942-.03823c-.1327.01366-.2612.05372-.3782.1178-.1169.06409-.2198.15091-.3027.25537l-4.3 5.159-2.225-2.226c-.1886-.1822-.4412-.283-.7034-.2807s-.51301.1075-.69842.2929-.29058.4362-.29285.6984c-.00228.2622.09851.5148.28067.7034l3 3c.0983.0982.2159.1748.3454.2251.1295.0502.2681.0729.4069.0665.1387-.0063.2747-.0414.3991-.1032.1244-.0617.2347-.1487.3236-.2554z"/></svg>
      <div class="t"><b>完成</b>19 份講義已匯出成 PDF</div>
      <button class="x" type="button" aria-label="關閉：已匯出提示"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m15.8333 5.34166-1.175-1.175-4.6583 4.65834-4.65833-4.65834-1.175 1.175 4.65833 4.65834-4.65833 4.6583 1.175 1.175 4.65833-4.6583 4.6583 4.6583 1.175-1.175-4.6583-4.6583z"/></svg></button>
    </div></div></div>
    <div class="wrapR"><div><div class="alert warn" role="status">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.27 2.99a2 2 0 0 1 3.46 0l9.02 15.5A2 2 0 0 1 21.02 21.5H2.98a2 2 0 0 1-1.73-3.01zM12 8a1.1 1.1 0 0 0-1.1 1.1v4.8a1.1 1.1 0 0 0 2.2 0V9.1A1.1 1.1 0 0 0 12 8zm0 9.9a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>
      <div class="t"><b>注意</b>2 張圖超過 500KB，建議先壓縮</div>
      <button class="x" type="button" aria-label="關閉：圖片過大提示"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m15.8333 5.34166-1.175-1.175-4.6583 4.65834-4.65833-4.65834-1.175 1.175 4.65833 4.65834-4.65833 4.6583 1.175 1.175 4.65833-4.6583 4.6583 4.6583 1.175-1.175-4.6583-4.6583z"/></svg></button>
    </div></div></div>
    <div class="wrapR"><div><div class="alert bad" role="alert">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1a11 11 0 1 0 0 22a11 11 0 1 0 0-22z M14.4 8.04 L15.96 9.6 L13.56 12 L15.96 14.4 L14.4 15.96 L12 13.56 L9.6 15.96 L8.04 14.4 L10.44 12 L8.04 9.6 L9.6 8.04 L12 10.44Z"/></svg>
      <div class="t"><b>失敗</b>1 份檔名含半形冒號，未匯出</div>
      <button class="x" type="button" aria-label="關閉：匯出失敗提示"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m15.8333 5.34166-1.175-1.175-4.6583 4.65834-4.65833-4.65834-1.175 1.175 4.65833 4.65834-4.65833 4.6583 1.175 1.175 4.65833-4.6583 4.6583 4.6583 1.175-1.175-4.6583-4.6583z"/></svg></button>
    </div></div></div>
  </div>
  <div class="foot"><span id="cnt">3 則提示</span><button class="reset" type="button" id="reset">重新顯示</button></div>
</section>
<script>
(function(){
  var stack=document.getElementById("stack"),cnt=document.getElementById("cnt");
  function count(){var n=stack.querySelectorAll(".wrapR:not(.gone)").length;cnt.textContent=n?n+" 則提示":"沒有提示了";}
  stack.addEventListener("click",function(e){
    var b=e.target.closest(".x");if(!b)return;
    var a=b.closest(".alert"),w=b.closest(".wrapR");
    a.classList.add("out");
    setTimeout(function(){w.classList.add("gone");count();
      var all=[].slice.call(stack.querySelectorAll(".wrapR")),i=all.indexOf(w),next=null;for(var k=i+1;k<all.length&&!next;k++)if(!all[k].classList.contains("gone"))next=all[k].querySelector(".x");for(k=i-1;k>=0&&!next;k--)if(!all[k].classList.contains("gone"))next=all[k].querySelector(".x");(next||document.getElementById("reset")).focus();},200);
  });
  document.getElementById("reset").addEventListener("click",function(){
    stack.querySelectorAll(".wrapR").forEach(function(w){w.classList.remove("gone");w.querySelector(".alert").classList.remove("out");});count();
  });
})();
</script>
</body></html>
