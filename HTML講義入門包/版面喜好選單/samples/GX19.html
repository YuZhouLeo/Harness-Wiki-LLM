<!--
  GX19 搖鈴訂閱勾選（Bell checkbox: outline bell turns solid with a ring wiggle）
  來源：https://github.com/uiverse-io/galaxy　Checkboxes/catraco_brown-dodo-68.html
  原作者：catraco　授權：MIT (Copyright 2023 Uiverse.io)　commit：adbd2ad
  移植：保留原作的機制——空心鈴與實心鈴兩個 SVG 依勾選狀態切換顯示，切換時跑 keyframes-fill（.5s：淡入＋左右搖 25°／-20° 放大 1.2／15°），
    開與關都會搖一次；原作鈴鐺是 Font Awesome 路徑，改成自繪 inline SVG；搖擺中心由正中改到鈴頂，看起來像掛著的鈴；
    灰色 #a5a5b0 改成 P11：未訂閱 --ink-2、已訂閱 --accent；改成「課程通知」三列設定，副標同步顯示「新公告時推播／已靜音」（用 :has，不只靠顏色）；
    原作 input 寬高 0，改成蓋滿按鈕的透明 input，補 aria-label、focus-visible 外框；prefers-reduced-motion 時不搖，只淡入。
  2026-10-09 由子代理移植成純 HTML／CSS（必要時加少量原生 JS）
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搖鈴訂閱勾選</title>
<style>
:root{
  --bg:#e8ecef;--surface:#f6f8f9;--surface-2:#dde3e7;--ink:#11181f;--ink-2:#435059;--line:#c5cdd4;--line-strong:#2b3945;
  --accent:#006666;--on-accent:#ffffff;--accent-soft:#d7eeec;
  --c1:#006666;--c2:#845600;--c3:#2b5c96;--c4:#664990;--c1-soft:#d7eeec;--c2-soft:#f7ead0;--c3-soft:#dde7f3;--c4-soft:#e9e2f3;
  --ok:#1b6b3d;--warn:#845600;--bad:#b3261e;--ok-soft:#d9efe1;--warn-soft:#f7ead0;--bad-soft:#f8dedb;--answer:#b3261e;--hl:#ffe08a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px 16px;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.hd{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.hd h1{margin:0;font-size:15px;font-weight:700}
.hd p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.tag{flex:none;width:6px;align-self:stretch;border-radius:3px;background:var(--surface-2);transition:background-color .2s}
.row:has(input:checked) .tag{background:var(--accent)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:500}
.tx small{display:block;font-size:12px;color:var(--ink-2)}
.tx small .on{display:none;color:var(--accent);font-weight:700}
.row:has(input:checked) .tx small .on{display:inline}
.row:has(input:checked) .tx small .off{display:none}

/* 原作 .container */
.bell{--color:var(--ink-2);--size:22px;position:relative;flex:none;display:flex;justify-content:center;align-items:center;width:40px;height:40px;border-radius:50%;cursor:pointer;user-select:none;color:var(--color);-webkit-tap-highlight-color:transparent;transition:background-color .15s}
.bell:hover{background:var(--surface-2)}
.bell:has(input:checked){--color:var(--accent)}
.bell input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;border-radius:50%}
.bell:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.bell svg{position:absolute;width:var(--size);height:var(--size);transform-origin:50% 12%;animation:keyframes-fill .5s;pointer-events:none}
.bell .solid{display:none}
.bell input:checked~.regular{display:none}
.bell input:checked~.solid{display:block}
@keyframes keyframes-fill{0%{opacity:0}25%{transform:rotate(25deg)}50%{transform:rotate(-20deg) scale(1.2)}75%{transform:rotate(15deg)}}
@keyframes fade-only{0%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .bell svg{animation:fade-only .2s}
  .tag,.bell{transition:none}
}
</style></head><body>
<div class="card">
  <div class="hd"><h1>課程通知</h1><p>點鈴鐺開關推播；響一下代表已切換</p></div>
  <div class="row"><span class="tag"></span><span class="tx"><b>財務管理・作業與公告</b><small><span class="on">新公告時推播</span><span class="off">已靜音</span></small></span>
    <label class="bell"><input type="checkbox" checked aria-label="財務管理的通知">
      <svg class="regular" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.2a5.8 5.8 0 0 0-5.8 5.8v4.4l-1.7 2.9a.7.7 0 0 0 .6 1.1h13.8a.7.7 0 0 0 .6-1.1l-1.7-2.9V9A5.8 5.8 0 0 0 12 3.2z"/><path d="M9.6 20.2a2.5 2.5 0 0 0 4.8 0"/><path d="M12 1.6v1.6"/></svg>
      <svg class="solid" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.2a5.8 5.8 0 0 0-5.8 5.8v4.4l-1.7 2.9a.7.7 0 0 0 .6 1.1h13.8a.7.7 0 0 0 .6-1.1l-1.7-2.9V9A5.8 5.8 0 0 0 12 3.2z"/><path d="M9.6 19.6h4.8a2.5 2.5 0 0 1-4.8 0z"/><path d="M12 1.6v1.6" fill="none"/></svg>
    </label></div>
  <div class="row"><span class="tag"></span><span class="tx"><b>策略管理・課堂公告</b><small><span class="on">新公告時推播</span><span class="off">已靜音</span></small></span>
    <label class="bell"><input type="checkbox" aria-label="策略管理的通知">
      <svg class="regular" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.2a5.8 5.8 0 0 0-5.8 5.8v4.4l-1.7 2.9a.7.7 0 0 0 .6 1.1h13.8a.7.7 0 0 0 .6-1.1l-1.7-2.9V9A5.8 5.8 0 0 0 12 3.2z"/><path d="M9.6 20.2a2.5 2.5 0 0 0 4.8 0"/><path d="M12 1.6v1.6"/></svg>
      <svg class="solid" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.2a5.8 5.8 0 0 0-5.8 5.8v4.4l-1.7 2.9a.7.7 0 0 0 .6 1.1h13.8a.7.7 0 0 0 .6-1.1l-1.7-2.9V9A5.8 5.8 0 0 0 12 3.2z"/><path d="M9.6 19.6h4.8a2.5 2.5 0 0 1-4.8 0z"/><path d="M12 1.6v1.6" fill="none"/></svg>
    </label></div>
  <div class="row"><span class="tag"></span><span class="tx"><b>攝影社・活動報名</b><small><span class="on">新公告時推播</span><span class="off">已靜音</span></small></span>
    <label class="bell"><input type="checkbox" aria-label="攝影社的通知">
      <svg class="regular" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.2a5.8 5.8 0 0 0-5.8 5.8v4.4l-1.7 2.9a.7.7 0 0 0 .6 1.1h13.8a.7.7 0 0 0 .6-1.1l-1.7-2.9V9A5.8 5.8 0 0 0 12 3.2z"/><path d="M9.6 20.2a2.5 2.5 0 0 0 4.8 0"/><path d="M12 1.6v1.6"/></svg>
      <svg class="solid" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.2a5.8 5.8 0 0 0-5.8 5.8v4.4l-1.7 2.9a.7.7 0 0 0 .6 1.1h13.8a.7.7 0 0 0 .6-1.1l-1.7-2.9V9A5.8 5.8 0 0 0 12 3.2z"/><path d="M9.6 19.6h4.8a2.5 2.5 0 0 1-4.8 0z"/><path d="M12 1.6v1.6" fill="none"/></svg>
    </label></div>
</div>
</body></html>
