<!doctype html><!-- 版面喜好選單範例 AC10｜已複製泡泡上浮｜來源：講師範例庫 output範例/元件庫/AC10-已複製泡泡上浮.html；原始來源 https://github.com/animate-css/animate.css（source/fading_exits/fadeOutUp.css），作者 Daniel Eden，授權 Hippocratic-2.1。複製時調整：字型改成有網路才載入、改掉對外連結與示意內容裡的私人資料。 -->
<!--
  AC10 已複製泡泡上浮（fadeOutUp）
  來源：https://github.com/animate-css/animate.css　source/fading_exits/fadeOutUp.css
  原作者：Daniel Eden　授權：Hippocratic License 2.1 (Copyright 2021 Daniel Eden)　commit：3f8ab23
  移植：抄 fadeOutUp 的 @keyframes（opacity 1→0、translate3d 0 → -100%）與 .animated 的 fill-mode both；
    時長從原作預設 1s 縮成 .7s；情境設成「常用指令」卡：按複製鈕，按鈕上方冒出「已複製」小泡泡，往上浮起淡出，
    同時按鈕圖示換成勾 1.2 秒（換圖示是移植另加的）；沒有剪貼簿權限（本機檔案、iframe）時退回 execCommand 複製，兩種都失敗才改說「請手動複製」；
    配色照 P11 淺色主控台，泡泡用主字色底、勾用 --accent。
    （本支原為入選的 attention_seekers/shakeX，因和既有 AC01 查核錯誤欄搖頭（headShake）用途重疊，改用同組備選 fadeOutUp。）
    prefers-reduced-motion 時泡泡不位移，只淡出。
  2026-10-09 由子代理移植成純 HTML／CSS（必要時加少量原生 JS）
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已複製泡泡上浮</title>
<style>
:root{
  --bg:#e8ecef;--surface:#f6f8f9;--surface-2:#dde3e7;--ink:#11181f;--ink-2:#435059;--line:#c5cdd4;--line-strong:#2b3945;
  --accent:#006666;--on-accent:#ffffff;--accent-soft:#d7eeec;
  --c1:#006666;--c2:#845600;--c3:#2b5c96;--c4:#664990;--c1-soft:#d7eeec;--c2-soft:#f7ead0;--c3-soft:#dde7f3;--c4-soft:#e9e2f3;
  --ok:#1b6b3d;--warn:#845600;--bad:#b3261e;--ok-soft:#d9efe1;--warn-soft:#f7ead0;--bad-soft:#f8dedb;--answer:#b3261e;--hl:#ffe08a;
  --animate-duration:.7s;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.panel{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.hd{padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--surface-2)}
.row:last-child{border-bottom:0}
.txt{flex:1;min-width:0}
.txt span{display:block;font-size:12px;color:var(--ink-2)}
.txt code{display:block;margin-top:2px;padding:4px 8px;border-radius:4px;background:var(--surface-2);font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{position:relative;flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2);cursor:pointer;margin-top:16px}
.cp:hover{border-color:var(--line-strong);color:var(--ink)}
.cp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cp svg{width:16px;height:16px}
.cp .ok{display:none;color:var(--accent)}
.cp.done .ok{display:block}.cp.done .copy{display:none}
.cp.done{border-color:var(--accent)}
/* 泡泡：在按鈕正上方 */
.bub{position:absolute;bottom:calc(100% + 6px);left:50%;margin-left:-32px;width:64px;padding:3px 0;border-radius:4px;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.4;text-align:center;white-space:nowrap;pointer-events:none}
.bub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--ink)}
.bub.wide{width:88px;margin-left:-44px}

/* animate.css：.animated＋fadeOutUp（原樣） */
.animated{animation-duration:var(--animate-duration);animation-fill-mode:both}
@keyframes fadeOutUp{from{opacity:1}to{opacity:0;transform:translate3d(0,-100%,0)}}
.fadeOutUp{animation-name:fadeOutUp;animation-timing-function:ease-in}
@keyframes rmFade{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.fadeOutUp{animation-name:rmFade}}
</style></head><body>
<section class="panel" aria-labelledby="h">
  <div class="hd" id="h">常用指令</div>
  <div class="row"><div class="txt"><span>手動同步 vault</span><code>sh .scripts/sync.sh "feat: 新增日本行程"</code></div>
    <button class="cp" type="button" aria-label="複製：手動同步 vault"><svg class="copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><svg class="ok" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div class="row"><div class="txt"><span>檢查 1-raw 有沒有被改</span><code>uv run --no-project python .scripts/raw_checksum.py check</code></div>
    <button class="cp" type="button" aria-label="複製：檢查 1-raw 有沒有被改"><svg class="copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><svg class="ok" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div class="row"><div class="txt"><span>更新 impeccable</span><code>npx impeccable update</code></div>
    <button class="cp" type="button" aria-label="複製：更新 impeccable"><svg class="copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><svg class="ok" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</section>
<div id="sr" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<script>
(function(){
  var sr=document.getElementById("sr");
  function pop(btn,text){
    var old=btn.querySelector(".bub");if(old)old.remove();
    var b=document.createElement("span");b.className="bub animated fadeOutUp"+(text.length>3?" wide":"");b.textContent=text;b.setAttribute("aria-hidden","true");
    btn.appendChild(b);b.addEventListener("animationend",function(){b.remove()});
    sr.textContent=text;
    if(text==="已複製"){btn.classList.add("done");clearTimeout(btn._t);btn._t=setTimeout(function(){btn.classList.remove("done")},1200);}
  }
  // 沒有剪貼簿權限時（本機檔案、iframe）退回 execCommand
  function legacy(text){
    var t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";
    document.body.appendChild(t);t.select();var ok=false;try{ok=document.execCommand("copy")}catch(_){}t.remove();return ok;
  }
  document.querySelectorAll(".cp").forEach(function(btn){
    btn.addEventListener("click",function(){
      var text=btn.parentNode.querySelector("code").textContent;
      var p=null;try{p=navigator.clipboard&&navigator.clipboard.writeText(text)}catch(_){p=null}
      if(p&&p.then)p.then(function(){pop(btn,"已複製")},function(){pop(btn,legacy(text)?"已複製":"請手動複製")});else pop(btn,legacy(text)?"已複製":"請手動複製");
    });
  });
})();
</script>
</body></html>
