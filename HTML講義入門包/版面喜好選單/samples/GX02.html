<!doctype html><!-- 版面喜好選單範例 GX02｜掃色外框按鈕｜來源：講師範例庫 output範例/元件庫/GX02-掃色外框按鈕.html；原始來源 https://github.com/uiverse-io/galaxy（Buttons/Bodyhc_itchy-dragonfly-35.html），作者 Bodyhc，授權 MIT。複製時調整：字型改成有網路才載入、改掉對外連結與示意內容裡的私人資料。 -->
<!--
  GX02 掃色外框按鈕（Fill-sweep outline button）
  來源：https://github.com/uiverse-io/galaxy　Buttons/Bodyhc_itchy-dragonfly-35.html
  原作者：Bodyhc　授權：MIT
  移植：原作紫色 #560bad 改成藍／綠兩個變體（用 --c 變數），文字改繁中，加 focus-visible 同 hover 效果與 reduced-motion 退化；移除外層 margin。
  2026-10-08 由子代理移植成純 HTML／CSS
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>demo</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#f5f6f8;color:#1f2937;font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;align-items:center;justify-content:center}.cap{font-size:12px;color:#6b7280;margin-top:14px;text-align:center}
.grp{display:flex;gap:18px}
.btn{--c:#1d4ed8;background:#fff;font:inherit;font-weight:500;font-size:16px;width:8.5em;height:2.6em;position:relative;overflow:hidden;border:2px solid var(--c);color:var(--c);border-radius:6px;cursor:pointer;z-index:1;transition:color .5s}
.btn.g{--c:#2f7d46}
.btn::before{content:"";position:absolute;z-index:-1;background:var(--c);height:150px;width:200px;border-radius:50px;bottom:100%;right:100%;transition:.8s ease}
.btn:hover,.btn:focus-visible{color:#fff}
.btn:hover::before,.btn:focus-visible::before{bottom:-30px;left:-30px}
.btn:active::before{filter:brightness(.8)}
@media (prefers-reduced-motion:reduce){.btn,.btn::before{transition:none}}
</style></head><body><div><div class="grp"><button class="btn">下載講義</button><button class="btn g">匯出 PDF</button></div><div class="cap">滑過去：底色從左上角掃滿整顆按鈕（顏色各綁一種動作）</div></div></body></html>
