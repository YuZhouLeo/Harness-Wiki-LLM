<!doctype html><!-- 版面喜好選單範例 GX06｜時鐘載入指示｜來源：講師範例庫 output範例/元件庫/GX06-時鐘載入指示.html；原始來源 https://github.com/uiverse-io/galaxy（loaders/Ali-Tahmazi99_breezy-squid-90.html），作者 Ali-Tahmazi99，授權 MIT。複製時調整：字型改成有網路才載入、改掉對外連結與示意內容裡的私人資料。 -->
<!--
  GX06 時鐘載入指示（Clock-hand loader）
  來源：https://github.com/uiverse-io/galaxy　loaders/Ali-Tahmazi99_breezy-squid-90.html
  原作者：Ali-Tahmazi99　授權：MIT
  移植：幾乎照原作，只加 role=status、aria-label、「載入中…」文字；reduced-motion 時指針停止並固定角度。
  2026-10-08 由子代理移植成純 HTML／CSS
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>demo</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#f5f6f8;color:#1f2937;font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;align-items:center;justify-content:center}.cap{font-size:12px;color:#6b7280;margin-top:14px;text-align:center}
.w{display:flex;flex-direction:column;align-items:center;gap:12px}
.loader{width:65px;height:65px;border:8px solid #ee9b00a6;border-radius:50px;position:relative}
.loader span{display:block;background:#ee9b00}
.hour,.min{width:6px;height:22px;border-radius:50px;position:absolute;top:24.5px;left:21px;animation:tick 1.2s linear infinite;transform-origin:top center}
.min{height:17px;animation-duration:4s}
.circel{width:10px;height:10px;border-radius:50px;position:absolute;top:19px;left:19px}
@keyframes tick{to{transform:rotate(360deg)}}
.t{font-weight:700}
@media (prefers-reduced-motion:reduce){.hour,.min{animation:none}.min{transform:rotate(120deg)}}
</style></head><body><div class="w"><div class="loader" role="status" aria-label="載入中"><span class="hour"></span><span class="min"></span><span class="circel"></span></div><div class="t">載入中…</div><div class="cap" style="margin:0">時鐘指針轉動；減少動態模式下指針靜止</div></div></body></html>
